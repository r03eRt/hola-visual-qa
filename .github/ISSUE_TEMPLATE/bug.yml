name: Bug
description: Defect in already-implemented behaviour
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Affected capability (row in docs/STATUS.md)
    validations:
      required: false
